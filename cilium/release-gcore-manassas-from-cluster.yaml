cluster:
  id: 1
  name: gcore-manassas
clustermesh:
  apiserver:
    replicas: 2
    service:
      type: NodePort
      nodePort: 32379
      externalTrafficPolicy: Local
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                k8s-app: clustermesh-apiserver
            topologyKey: kubernetes.io/hostname
    tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
    updateStrategy:
      type: Recreate
      rollingUpdate: null
    tls:
      auto:
        enabled: true
        method: cronJob
        schedule: 0 0 1 */4 *
  cacheTTL: 300s
  config:
    clusters:
      - ips:
          - 95.216.171.30 # hel1-nd01.cxense.com
          - 135.181.106.231 # hel1-nd02.cxense.com
        name: hetzner-helsinki
        port: 32379
    enabled: true
  enableEndpointSliceSynchronization: true
  mcsapi:
    corednsAutoConfigure:
      coredns:
        clusterDomain: gcore-manassas
        clustersetDomain: mesh.local
      enabled: true
    enabled: true
    installCRDs: true
  useAPIServer: true
envoy:
  enabled: false
gatewayAPI:
  enabled: false
hostFirewall:
  enabled: true
hubble:
  peerService:
    clusterDomain: gcore-manassas
  relay:
    enabled: true
  ui:
    enabled: true
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
      - 10.1.0.0/16
ipv4:
  enabled: true
ipv6:
  enabled: false
k8sServiceHost: 169.254.10.10
k8sServicePort: 6444
kubeProxyReplacement: true
operator:
  replicas: 1
policyAuditMode: false
policyEnforcementMode: always
routingMode: tunnel
tunnelProtocol: vxlan
