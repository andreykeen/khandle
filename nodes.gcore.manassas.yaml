---
global:
  cluster_name: gcore-manassas
  kubernetes_version: "1.35.5"
  # image_repository: docker-registry.cxense.com/kubernetes
  ssh_connection:
    port: 22
    username: ubuntu
    private_key: ~/.ssh/piano-nodebot-new
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: false
  os:
    apt_packages:
      - apt-transport-https
      - ca-certificates
      - conntrack
      - curl
      - gpg
      - net-tools
    sysctl:
      - net.ipv4.ip_forward = 1
    kernel_modules:
      - overlay
      - br_netfilter

cluster_network:
  apiserver_cert_extra_sans:
    - 127.0.0.1
    - ${nodes[0].public_ip}
    - 82.158.117.100
    - k8s.mnz-prod.cxense.com
    # - ${nodes[1].public_ip}
    # - ${nodes[3].public_ip}
  control_plane_endpoint: 169.254.10.10:6444
  control_plane_interface: true
  pod_network_cidr: 10.1.0.0/16
  service_cidr: 10.51.0.0/16
  service_dns_domain: "gcore-manassas"
  kube_proxy:
    enabled: false

nodes:
##########################################
### Control plane nodes
##########################################
  - hostname: mnz-bm-0001
    public_ip: 82.158.117.60
    private_ip: 172.21.0.60
    control_plane: true
    kubernetes:
      version: ${global.kubernetes_version}
      apiserver_advertise_address: ${nodes[0].public_ip}
      labels:
        node.kubernetes.io/instance-type: cpx21
        node.kubernetes.io/region: manassas
      kubelet:
        config:
          systemReserved:
            cpu: 1000m
            memory: 1Gi
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[0].public_ip}

##########################################
### Worker nodes
##########################################
  - hostname: mnz-bm-0002
    public_ip: 82.158.117.61
    private_ip: 172.21.0.61
    control_plane: false
    kubernetes:
      version: ${global.kubernetes_version}
      labels:
        node.kubernetes.io/instance-type: cpx21
        node.kubernetes.io/region: manassas
        node-role.kubernetes.io/worker: ""
      kubelet:
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[1].public_ip}

