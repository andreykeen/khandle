#cloud-config
package_update: true
package_upgrade: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - gnupg
  - jq
  - mc
  - net-tools
  - qrencode
  - software-properties-common
  - wireguard

runcmd:
  - sed -i '/#net.ipv4.ip_forward/s/^#//g' /etc/sysctl.conf
  - sysctl -p
