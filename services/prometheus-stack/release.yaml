---
defaultRules:
  create: true

global:
  rbac:
    create: true

alertmanager:
  enabled: false

grafana:
  enabled: true

kubeApiServer:
  enabled: true
  selector:
    matchLabels:
      component: kube-apiserver

kubelet:
  enabled: true

kubeControllerManager:
  enabled: true
  service:
    port: 10257
    targetPort: 10257

  serviceMonitor:
    https: true
    insecureSkipVerify: true

coreDns:
  enabled: true

kubeEtcd:
  enabled: true
  endpoints: []

  service:
    port: 2381
    targetPort: 2381
    selector:
      component: etcd

kubeScheduler:
  enabled: true
  serviceMonitor:
    insecureSkipVerify: true

kubeProxy:
  enabled: false

kubeStateMetrics:
  enabled: true
