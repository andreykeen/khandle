---
global:
  ssh_connection:
    port: 22
    username: ubuntu
    private_key: ~/.ssh/piano-nodebot-new
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: false

cluster_network:
  apiserver_cert_extra_sans:
    - 127.0.0.1
    - 54.219.237.159
  control_plane_endpoint: 127.0.0.1:6444
  pod_network_cidr: 172.17.0.0/18
  service_dns_domain: ""
  kube_proxy:
    enabled: true
  cni:
    calico:

control_planes:
  - hostname: nd01.us-west-1.cxense.com
    public_ip: 54.219.237.159
    private_ip: 10.1.0.43
    apiserver_advertise_address: ""
    kubernetes:
      version: 1.31.0
      labels:
        node.kubernetes.io/instance-type: "t3a.xlarge"
      kubelet:
        config:
          systemReserved:
            cpu: 1000m
            memory: 1Gi
