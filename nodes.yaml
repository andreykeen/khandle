---
global:
  ssh_connection:
    port: 22
    username: ubuntu
    private_key: ~/.ssh/aws-khandle-cluster-nodes
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: true

bastion:
  address: 3.123.128.116
  port: 22
  username: ubuntu
  private_key: ~/.ssh/aws-khandle-bastion-node

control_planes:
  - hostname: nd01
    public_ip: 3.72.49.192
    private_ip: 10.0.0.143
    role: control-plane
    location: eu-central-1a
    labels:
      environment: production
      team: platform
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/control-plane=true"
  - hostname: nd02
    public_ip: 63.176.167.0
    private_ip: 10.0.0.107
    role: control-plane
    location: eu-central-1a
    labels:
      environment: production
      team: platform
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/control-plane=true"
  - hostname: nd03
    public_ip: 3.76.205.243
