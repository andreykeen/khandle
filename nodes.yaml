---
global:
  ssh_connection:
    port: 22
    username: ubuntu
    private_key: "~/.ssh/aws-khandle-cluster-nodes"
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: false

bastion:
  hostname: de1348.cxense.com
  port: 3022
  username: andreyvladimirskiy
  private_key: ""

control_planes:
  - hostname: nd01
    public_ip: 18.193.84.207
    private_ip: 10.0.0.237
    role: control-plane
    location: eu-central-1a
    labels:
      environment: production
      team: platform
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/control-plane=true"
  - hostname: nd02
    public_ip: 18.153.209.130
    private_ip: 10.0.0.143
    role: control-plane
    location: eu-central-1a
    labels:
      environment: production
      team: platform
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/control-plane=true"
  - hostname: nd03
    public_ip: 3.79.239.191
    private_ip: 10.0.0.201
    role: control-plane
    location: eu-central-1a
    labels:
      environment: production
      team: platform
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/control-plane=true"
workers:
  - hostname: node-04
    public_ip: 192.168.1.104
    private_ip: 10.0.0.4
    role: worker
    location: us-west-1a
    labels:
      environment: production
      team: applications
      workload-type: general
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/worker=true"
  - hostname: node-05
    public_ip: 192.168.1.105
    private_ip: 10.0.0.5
    role: worker
    location: us-west-1a
    labels:
      environment: production
      team: applications
      workload-type: general
    kubernetes:
      version: 1.31.0
      kubelet:
        extra_args:
          - "--node-labels=node-role.kubernetes.io/worker=true"







