worker_nodes:
  - hostname: nd04
    public_ip: 3.79.109.31
    private_ip: 10.0.0.139
    location: eu-central-1a
    kubernetes:
      version: 1.31.0
      labels:
        node-role.kubernetes.io/worker: ""
        node.kubernetes.io/instance-type: "t3a.xlarge"
      kubelet:
        config:
          maxPods: 220
          systemReserved:
            cpu: 2000m
            memory: 2Gi
        extra_args:
          - "--node-labels=node-role.kubernetes.io/worker=true"
