---
installation:
  cni:
    type: Calico
  calicoNetwork:
    bgp: Disabled
    linuxDataplane: BPF
    ipPools:
      - name: default-ipv4-ippool
        blockSize: 24
        cidr: 172.18.0.0/18
        encapsulation: VXLAN
        natOutgoing: Enabled
        nodeSelector: all()
    # nodeAddressAutodetectionV4:
    #   cidrs:
    #     - 10.4.0.0/16

kubernetesServiceEndpoint:
  host: 169.254.10.10
  port: 6444
