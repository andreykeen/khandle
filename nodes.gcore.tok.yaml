---
global:
  cluster_name: "gcore.tok"
  kubernetes_version: "1.32.6"
  # image_repository: docker-registry.cxense.com/kubernetes
  ssh_connection:
    port: 22
    username: ubuntu
    private_key: ~/.ssh/piano-nodebot-new
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: false
    bastion:
      address: 5.78.189.29
      port: 22
      username: ubuntu
      private_key: ~/.ssh/aws-khandle-bastion-node

cluster_network:
  apiserver_cert_extra_sans:
    - 127.0.0.1
    - ${nodes[0].public_ip}
    # - ${nodes[1].public_ip}
    # - ${nodes[3].public_ip}
  control_plane_endpoint: 169.254.10.10:6444
  pod_network_cidr: 172.18.0.0/18
  service_dns_domain: ""
  kube_proxy:
    enabled: false

nodes:
  - hostname: tok01.cxense.com
    public_ip: 82.158.123.201
    # private_ip: 10.4.0.2
    control_plane: true
    kubernetes:
      version: ${global.kubernetes_version}
      apiserver_advertise_address: ${nodes[0].public_ip}
      labels:
        node.kubernetes.io/provider: gcore
        node.kubernetes.io/region: tok
        node.kubernetes.io/instance-type: g0-standard-2-4
        node-role.kubernetes.io/worker: ""
      kubelet:
        config:
          systemReserved:
            cpu: 1000m
            memory: 1Gi
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[0].public_ip}
  - hostname: tok02.cxense.com
    public_ip: 82.158.123.202
    # private_ip: 10.4.0.3
    control_plane: false
    kubernetes:
      version: ${global.kubernetes_version}
      apiserver_advertise_address: ${nodes[1].public_ip}
      labels:
        node.kubernetes.io/provider: gcore
        node.kubernetes.io/region: tok
        node.kubernetes.io/instance-type: g2-standard-2-4
        node-role.kubernetes.io/worker: ""
      kubelet:
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[1].public_ip}
