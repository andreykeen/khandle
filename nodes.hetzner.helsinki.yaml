---
global:
  cluster_name: hetzner-helsinki
  kubernetes_version: "1.35.5"
  # image_repository: docker-registry.cxense.com/kubernetes
  ssh_connection:
    port: 22
    username: root
    private_key: ~/.ssh/piano-nodebot
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: false
    bastion:
      address: 5.78.189.29
      port: 22
      username: ubuntu
      private_key: ~/.ssh/aws-khandle-bastion-node
  os:
    apt_packages:
      - apt-transport-https
      - ca-certificates
      - conntrack
      - curl
      - gpg
      - net-tools
    sysctl:
      - net.ipv4.ip_forward = 1
    kernel_modules:
      - overlay
      - br_netfilter

cluster_network:
  apiserver_cert_extra_sans:
    - 127.0.0.1
    - ${nodes[0].public_ip}
    - 65.109.43.90
    # - ${nodes[1].public_ip}
    # - ${nodes[2].public_ip}
  control_plane_endpoint: 169.254.10.10:6444
  control_plane_interface: true
  pod_network_cidr: 10.10.0.0/16
  service_cidr: 10.60.0.0/16
  service_dns_domain: "hetzner-helsinki"
  kube_proxy:
    enabled: false

nodes:
##########################################
### Control plane nodes
##########################################
  - hostname: hel1-nd01.cxense.com
    public_ip: 95.216.171.30
    private_ip: 10.4.0.2
    control_plane: true
    kubernetes:
      version: ${global.kubernetes_version}
      apiserver_advertise_address: ${nodes[0].public_ip}
      labels:
        node.kubernetes.io/instance-type: cpx22
        node.kubernetes.io/region: helsinki
        node-role.kubernetes.io/worker: ""
      kubelet:
        config:
          systemReserved:
            cpu: 1000m
            memory: 1Gi
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[0].public_ip}

  - hostname: hel1-nd02.cxense.com
    public_ip: 135.181.106.231
    private_ip: 10.4.0.3
    control_plane: false
    kubernetes:
      version: ${global.kubernetes_version}
      # apiserver_advertise_address: ${nodes[1].public_ip}
      labels:
        node.kubernetes.io/instance-type: cpx22
        node.kubernetes.io/region: helsinki
        node-role.kubernetes.io/worker: ""
      kubelet:
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[1].public_ip}

