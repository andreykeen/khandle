cluster_network:
  apiserver_cert_extra_sans:
    - 127.0.0.1
    - 18.157.68.97
  control_plane_endpoint: 127.0.0.1:6444
  pod_network_cidr: 172.16.0.0/18
  service_dns_domain: ""
  kube_proxy:
    enabled: true
  cni:
    calico:

control_planes:
  - hostname: nd01.eu-central-1.cxense.com
    public_ip: 18.157.68.97
    private_ip: 10.0.1.235
    kubernetes:
      version: 1.31.0
      labels:
        node.kubernetes.io/instance-type: "t3a.xlarge"
      kubelet:
        config:
          systemReserved:
            cpu: 1000m
            memory: 1Gi
        kubeadm_args: []
