---
global:
  cluster_name: hetzner-hillsboro
  kubernetes_version: "1.35.5"
  # image_repository: docker-registry.cxense.com/kubernetes
  ssh_connection:
    port: 22
    username: root
    private_key: ~/.ssh/piano-nodebot
    connect_through: public_ip # Possible values: hostname, public_ip, private_ip
    use_bastion: false
    bastion:
      address: 5.78.189.29
      port: 22
      username: ubuntu
      private_key: ~/.ssh/aws-khandle-bastion-node
  os:
    apt_packages:
      - apt-transport-https
      - ca-certificates
      - conntrack
      - curl
      - gpg
      - net-tools
    sysctl:
      - net.ipv4.ip_forward = 1
    kernel_modules:
      - overlay
      - br_netfilter

cluster_network:
  apiserver_cert_extra_sans:
    - 127.0.0.1
    - ${nodes[0].public_ip}
    # - ${nodes[1].public_ip}
    # - ${nodes[3].public_ip}
  control_plane_endpoint: 169.254.10.10:6444
  control_plane_interface: true
  pod_network_cidr: 10.11.0.0/16
  service_cidr: 10.61.0.0/16
  service_dns_domain: "hetzner-hillsboro"
  kube_proxy:
    enabled: false

nodes:
##########################################
### Control plane nodes
##########################################
  - hostname: hil-nd01.cxense.com
    public_ip: 5.78.209.185
    private_ip: 10.2.0.2
    control_plane: true
    kubernetes:
      version: ${global.kubernetes_version}
      apiserver_advertise_address: ${nodes[0].public_ip}
      labels:
        node.kubernetes.io/instance-type: cpx21
        node.kubernetes.io/region: hillsboro
      kubelet:
        config:
          systemReserved:
            cpu: 1000m
            memory: 1Gi
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[0].public_ip}

##########################################
### Worker nodes
##########################################
  - hostname: hil-nd02.cxense.com
    public_ip: 5.78.202.252
    private_ip: 10.2.0.3
    control_plane: false
    kubernetes:
      version: ${global.kubernetes_version}
      labels:
        node.kubernetes.io/instance-type: cpx21
        node.kubernetes.io/region: hillsboro
        node-role.kubernetes.io/worker: ""
      kubelet:
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[1].public_ip}

  - hostname: hil-nd03.cxense.com
    public_ip: 5.78.139.108
    private_ip: 10.2.0.4
    control_plane: false
    kubernetes:
      version: ${global.kubernetes_version}
      labels:
        node.kubernetes.io/instance-type: cpx21
        node.kubernetes.io/region: hillsboro
        node-role.kubernetes.io/worker: ""
      kubelet:
        kubelet_kubeadm_args:
          - --max-pods=200
          - --node-ip=${nodes[2].public_ip}
